name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          AUTH_USERNAME: testuser
          AUTH_PASSWORD: testpass-strong-99
          PYTHONPATH: "${{ github.workspace }}/backend"
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  web-build:
    name: web-build (public marketing site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Assert the static export is complete
        run: |
          set -euo pipefail
          for path in \
            index.html \
            architecture/index.html \
            trading/index.html \
            security/index.html \
            onchain/index.html \
            about/index.html \
            robots.txt \
            sitemap.xml \
            opengraph-image
          do
            test -s "out/$path" || { echo "missing or empty: out/$path"; exit 1; }
          done
          # The OG image is written without a file extension; make sure it is
          # still a real PNG before it reaches a social unfurler.
          file out/opengraph-image | grep -q 'PNG image data'
