name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Run tests
        env:
          AUTH_USERNAME: testuser
          AUTH_PASSWORD: testpass-strong-99
          PYTHONPATH: "${{ github.workspace }}/backend"
        run: python -m pytest tests/ -q

  immutable-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify npm integrity and downloaded asset SHA-256
        run: python scripts/verify_build_inputs.py --network-assets

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:shared
      - run: npm run build

  web-build:
    name: web-build (public marketing site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assert the static export is complete
        run: |
          set -euo pipefail
          for path in \
            index.html \
            architecture/index.html \
            trading/index.html \
            security/index.html \
            proof/index.html \
            onchain/index.html \
            about/index.html \
            robots.txt \
            sitemap.xml \
            opengraph-image
          do
            test -s "out/$path" || { echo "missing or empty: out/$path"; exit 1; }
          done
          # The OG image is written without a file extension; make sure it is
          # still a real PNG before it reaches a social unfurler.
          file out/opengraph-image | grep -q 'PNG image data'

  container-smoke:
    name: combined immutable-image smoke
    runs-on: ubuntu-latest
    needs: [backend-tests, immutable-inputs, frontend-build, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build exact combined image
        run: |
          docker build \
            --build-arg "SAPPHIRE_BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "SAPPHIRE_BUILD_ID=github-${GITHUB_RUN_ID}" \
            --tag sapphire-alpha-dashboard:ci \
            .
      - name: Verify runtime provenance and both surfaces
        run: |
          docker run --detach --rm \
            --name sapphire-alpha-dashboard-ci \
            --publish 8080:8080 \
            --env AUTH_USERNAME=testuser \
            --env AUTH_PASSWORD=testpass-strong-99 \
            --env K_SERVICE=sapphire-alpha-dashboard \
            --env K_REVISION=sapphire-alpha-dashboard-ci \
            sapphire-alpha-dashboard:ci
          trap 'docker stop sapphire-alpha-dashboard-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/build > /tmp/build.json
          python -c 'import json, os; p=json.load(open("/tmp/build.json")); assert p["source_sha"] == os.environ["GITHUB_SHA"]; assert p["complete"] is True; assert all(s["asset_count"] > 0 and len(s["manifest_sha256"]) == 64 for s in p["surfaces"].values())'
          curl --fail --silent http://127.0.0.1:8080/ | grep --quiet 'id="public-title"'
          curl --fail --silent http://127.0.0.1:8080/dashboard | grep --quiet '<div id="root"></div>'
          curl --fail --silent http://127.0.0.1:8080/research/calibration-2026-07-27/ | grep --quiet '<title>Learning loop'
