<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Decision inbox · Sapphire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --midnight: var(--tg-theme-bg-color, #0b1324);
    --slate: var(--tg-theme-secondary-bg-color, #17233a);
    --powder: var(--tg-theme-text-color, #dce7f7);
    --quiet: var(--tg-theme-hint-color, #86a9d7);
    --amber: #f0b75a;
    --coral: #ef756d;
    --line: rgba(134, 169, 215, .24);
    --action: var(--tg-theme-button-color, #4d77ad);
    --action-ink: var(--tg-theme-button-text-color, #ffffff);
    --display: "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --utility: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { background: var(--midnight); }

  body {
    min-height: 100dvh;
    margin: 0;
    background: var(--midnight);
    color: var(--powder);
    font: 15px/1.5 var(--body);
    padding: max(18px, env(safe-area-inset-top)) 16px
      calc(24px + env(safe-area-inset-bottom));
  }

  button { font: inherit; }

  .masthead {
    padding: 4px 2px 18px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow,
  .utility {
    font-family: var(--utility);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .eyebrow { color: var(--quiet); }

  h1 {
    margin: 7px 0 4px;
    font: 700 clamp(31px, 10vw, 44px)/.95 var(--display);
    letter-spacing: -.025em;
  }

  .status-line {
    min-height: 21px;
    margin: 0;
    color: var(--quiet);
    font-size: 13px;
  }

  .workflow-switch {
    display: grid;
    grid-template-columns: 1fr 1fr 38px;
    gap: 4px;
    margin: 14px 0 20px;
    padding: 3px;
    border: 1px solid var(--line);
    background: rgba(23, 35, 58, .78);
  }

  .workflow-switch button {
    min-height: 40px;
    border: 0;
    border-radius: 2px;
    background: transparent;
    color: var(--quiet);
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
  }

  .workflow-switch button[aria-selected="true"] {
    background: var(--powder);
    color: var(--midnight);
  }

  .workflow-switch .refresh {
    border-left: 1px solid var(--line);
    color: var(--powder);
    font: 18px/1 var(--utility);
  }

  button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .brief {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 16px;
  }

  .brief h2 {
    max-width: 270px;
    margin: 0;
    font: 650 24px/1.05 var(--display);
    letter-spacing: -.015em;
  }

  .brief p {
    flex: 0 0 auto;
    margin: 0;
    color: var(--quiet);
    text-align: right;
  }

  .docket {
    position: relative;
    padding-left: 23px;
  }

  .docket::before {
    position: absolute;
    top: 12px;
    bottom: 12px;
    left: 6px;
    width: 1px;
    background: var(--line);
    content: "";
  }

  .decision-card {
    --urgency-color: var(--quiet);
    position: relative;
    margin: 0 0 12px;
    padding: 14px 14px 13px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--urgency-color);
    border-radius: 3px 14px 3px 3px;
    background: var(--slate);
    animation: docket-in .28s ease-out both;
    animation-delay: calc(var(--order, 0) * 45ms);
  }

  .decision-card::before {
    position: absolute;
    top: 20px;
    left: -23px;
    width: 9px;
    height: 9px;
    border: 2px solid var(--midnight);
    border-radius: 50%;
    background: var(--urgency-color);
    content: "";
  }

  .decision-card.critical { --urgency-color: var(--coral); }
  .decision-card.high { --urgency-color: var(--amber); }

  .card-top,
  .outcome-top,
  .decision-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .urgency {
    color: var(--urgency-color);
    font-family: var(--utility);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .11em;
    text-transform: uppercase;
  }

  .expiry {
    color: var(--quiet);
    font-family: var(--utility);
    font-size: 11px;
  }

  .decision-card h3,
  .outcome-card h3 {
    margin: 11px 0 3px;
    font: 700 21px/1.1 var(--display);
    letter-spacing: -.01em;
    text-transform: capitalize;
  }

  .decision-meta {
    justify-content: flex-start;
    color: var(--quiet);
    font-size: 12px;
  }

  .chain {
    padding-left: 9px;
    border-left: 1px solid var(--line);
    font-family: var(--utility);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .impact {
    margin: 14px 0 0;
    padding: 10px 0 0;
    border-top: 1px solid var(--line);
  }

  .impact dt {
    margin-bottom: 3px;
    color: var(--quiet);
    font-family: var(--utility);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .impact dd { margin: 0; }

  .bot-action {
    width: 100%;
    min-height: 44px;
    margin-top: 14px;
    border: 0;
    border-radius: 3px 11px 3px 3px;
    background: var(--action);
    color: var(--action-ink);
    cursor: pointer;
    font-weight: 750;
  }

  .source-state,
  .error-state {
    padding: 20px 18px;
    border: 1px solid var(--line);
    border-radius: 3px 14px 3px 3px;
    background: var(--slate);
  }

  .source-state h2,
  .error-state h2 {
    margin: 8px 0 6px;
    font: 700 24px/1.05 var(--display);
  }

  .source-state p,
  .error-state p {
    margin: 0;
    color: var(--quiet);
  }

  .source-state .bot-action,
  .error-state .bot-action { margin-top: 18px; }

  .outcomes { display: grid; gap: 8px; }

  .outcome-card {
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 3px 11px 3px 3px;
    background: var(--slate);
  }

  .outcome-card h3 { font-size: 18px; }

  .outcome-decision {
    color: var(--quiet);
    font-family: var(--utility);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .outcome-copy {
    margin: 9px 0 0;
    color: var(--powder);
    font-size: 13px;
  }

  .read-only {
    margin: 20px 5px 0;
    color: var(--quiet);
    font-size: 11px;
    text-align: center;
  }

  @keyframes docket-in {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="eyebrow">Private decision rail</div>
  <h1>Decision inbox</h1>
  <p class="status-line" id="status-line">Connecting to the read-only snapshot…</p>
</header>

<section class="workflow-switch" role="tablist" aria-label="Decision workflow">
  <button type="button" role="tab" data-view="inbox" aria-selected="true">
    Inbox <span id="inbox-count">—</span>
  </button>
  <button type="button" role="tab" data-view="outcomes" aria-selected="false">
    Recent outcomes
  </button>
  <button class="refresh" type="button" id="refresh" aria-label="Refresh snapshot">↻</button>
</section>

<main id="view" aria-live="polite">
  <section class="source-state">
    <span class="utility">Connecting</span>
    <h2>Reading the decision snapshot.</h2>
    <p>This view does not infer state before the authenticated response arrives.</p>
  </section>
</main>

<p class="read-only">Read-only here. Approval, rejection, and arming stay on the bot rail.</p>

<script>
"use strict";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const initData = tg ? tg.initData : "";
const headers = { "Authorization": "tma " + initData };
const viewNode = document.getElementById("view");
const statusNode = document.getElementById("status-line");
const countNode = document.getElementById("inbox-count");
const refreshNode = document.getElementById("refresh");
let view = "inbox";
let summary = null;
let outcomes = null;

const esc = value => String(value ?? "—").replace(
  /[&<>"']/g,
  character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character])
);

function formatMoment(value) {
  if (!value) return "time not supplied";
  const moment = new Date(value);
  if (Number.isNaN(moment.getTime())) return "time not supplied";
  return moment.toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function expiryLabel(value) {
  if (!value) return "No expiry supplied";
  const expiry = new Date(value);
  if (Number.isNaN(expiry.getTime())) return "Expiry unreadable";
  const minutes = Math.round((expiry.getTime() - Date.now()) / 60000);
  if (minutes < -1) return `Expired ${Math.abs(minutes)}m ago`;
  if (minutes <= 1) return "Expires now";
  if (minutes < 60) return `Expires in ${minutes}m`;
  if (minutes < 1440) return `Expires in ${Math.round(minutes / 60)}h`;
  return `Expires ${formatMoment(value)}`;
}

function urgencyFor(item) {
  if (item.expires_at) {
    const minutes = (new Date(item.expires_at).getTime() - Date.now()) / 60000;
    if (Number.isFinite(minutes) && minutes <= 15) return "critical";
    if (Number.isFinite(minutes) && minutes <= 120) return "high";
  }
  const explicit = String(item.urgency || "").toLowerCase();
  if (["critical", "high", "normal", "low"].includes(explicit)) return explicit;
  return "unspecified";
}

function chainTag(item) {
  return item && item.chain
    ? `<span class="chain">${esc(item.chain)}</span>`
    : "";
}

function botButton() {
  return `<button class="bot-action" type="button" data-action="bot-deep-link">Open bot to decide</button>`;
}

function renderUnavailable(kind, status) {
  const label = status === "unavailable" ? "Snapshot unreadable" : "Not observed";
  const title = kind === "inbox"
    ? "This host has no inbox snapshot."
    : "This host has no outcome snapshot.";
  const copy = "Cloud Run cannot see files on the operator machines. Open the bot for current decision state.";
  return `<section class="source-state">
    <span class="utility">${esc(label)}</span>
    <h2>${title}</h2>
    <p>${copy}</p>
    ${botButton()}
  </section>`;
}

function renderInbox() {
  const inbox = summary && summary.inbox;
  if (!inbox || inbox.status !== "snapshot") {
    viewNode.innerHTML = renderUnavailable("inbox", inbox && inbox.status);
    return;
  }

  const items = Array.isArray(inbox.items) ? inbox.items : [];
  const observed = `Snapshot ${formatMoment(inbox.observed_at)}`;
  if (!items.length) {
    viewNode.innerHTML = `<section class="source-state">
      <span class="utility">${esc(observed)}</span>
      <h2>Inbox clear at this snapshot.</h2>
      <p>An observed empty queue is a real zero. Refresh or open the bot for current state.</p>
      ${botButton()}
    </section>`;
    return;
  }

  const urgencyRank = { critical: 0, high: 1, normal: 2, low: 3, unspecified: 4 };
  const orderedItems = [...items].sort((left, right) => {
    const urgencyDelta = urgencyRank[urgencyFor(left)] - urgencyRank[urgencyFor(right)];
    if (urgencyDelta) return urgencyDelta;
    return String(left.expires_at || "9999").localeCompare(String(right.expires_at || "9999"));
  });
  const cards = orderedItems.map((item, index) => {
    const urgency = urgencyFor(item);
    const impact = item.impact || "Impact not supplied";
    return `<article class="decision-card ${esc(urgency)}" style="--order:${index}">
      <div class="card-top">
        <span class="urgency">Urgency · ${esc(urgency)}</span>
        <span class="expiry">${esc(expiryLabel(item.expires_at))}</span>
      </div>
      <h3>${esc(item.action)} · ${esc(item.instrument)}</h3>
      <div class="decision-meta">
        <span>${esc(item.side)}</span>
        ${chainTag(item)}
      </div>
      <dl class="impact">
        <dt>Impact</dt>
        <dd>${esc(impact)}</dd>
      </dl>
      ${botButton()}
    </article>`;
  }).join("");

  viewNode.innerHTML = `<section class="brief">
    <h2>${orderedItems.length === 1 ? "One decision needs you." : `${orderedItems.length} decisions need you.`}</h2>
    <p class="utility">${esc(observed)}</p>
  </section>
  <section class="docket" aria-label="Pending decisions">${cards}</section>`;
}

function renderOutcomes() {
  if (!outcomes || outcomes.status !== "snapshot") {
    viewNode.innerHTML = renderUnavailable("outcomes", outcomes && outcomes.status);
    return;
  }

  const items = Array.isArray(outcomes.decisions) ? outcomes.decisions : [];
  if (!items.length) {
    viewNode.innerHTML = `<section class="source-state">
      <span class="utility">Snapshot ${esc(formatMoment(outcomes.observed_at))}</span>
      <h2>No recent outcomes in this snapshot.</h2>
      <p>The observed history file is empty.</p>
    </section>`;
    return;
  }

  viewNode.innerHTML = `<section class="brief">
    <h2>Recent outcomes</h2>
    <p class="utility">Snapshot ${esc(formatMoment(outcomes.observed_at))}</p>
  </section>
  <section class="outcomes" aria-label="Recent outcomes">${items.map(item => `
    <article class="outcome-card">
      <div class="outcome-top">
        <span class="outcome-decision">${esc(item.decision)}</span>
        <span class="expiry">${esc(formatMoment(item.timestamp))}</span>
      </div>
      <h3>${esc(item.action)} · ${esc(item.instrument)}</h3>
      <p class="outcome-copy">${esc(item.outcome || "No outcome note supplied")}</p>
    </article>
  `).join("")}</section>`;
}

function render() {
  document.querySelectorAll("[data-view]").forEach(button => {
    button.setAttribute("aria-selected", String(button.dataset.view === view));
  });
  countNode.textContent = summary && summary.inbox && summary.inbox.pending !== null
    ? String(summary.inbox.pending)
    : "—";
  if (view === "outcomes") renderOutcomes();
  else renderInbox();
}

function openBot() {
  const url = summary && summary.decision_url;
  if (!url || !/^https:\/\/t\.me\/[A-Za-z0-9_]{5,64}$/.test(url)) {
    statusNode.textContent = "Decision link is not configured.";
    return;
  }
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.location.assign(url);
}

async function load() {
  refreshNode.disabled = true;
  statusNode.textContent = "Refreshing the read-only snapshot…";
  try {
    const [summaryResponse, outcomesResponse] = await Promise.all([
      fetch("/api/tg/summary", { headers }),
      fetch("/api/tg/decisions", { headers })
    ]);
    if (summaryResponse.status === 401) {
      throw new Error("This Telegram identity is not allowed into the decision rail.");
    }
    if (summaryResponse.status === 503) {
      throw new Error("The decision rail is not configured on this host.");
    }
    if (!summaryResponse.ok) {
      throw new Error(`Decision snapshot failed with ${summaryResponse.status}.`);
    }
    summary = await summaryResponse.json();
    outcomes = outcomesResponse.ok ? await outcomesResponse.json() : null;
    statusNode.textContent = `Read-only view refreshed ${new Date(summary.updated_at).toLocaleTimeString()}.`;
    render();
  } catch (error) {
    statusNode.textContent = "Decision snapshot unavailable.";
    viewNode.innerHTML = `<section class="error-state">
      <span class="utility">Could not load</span>
      <h2>${esc(error.message)}</h2>
      <p>No queue or outcome state is inferred from this failure.</p>
      ${botButton()}
    </section>`;
  } finally {
    refreshNode.disabled = false;
  }
}

document.querySelector(".workflow-switch").addEventListener("click", event => {
  const target = event.target.closest("[data-view]");
  if (!target) return;
  view = target.dataset.view;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  render();
});

viewNode.addEventListener("click", event => {
  if (event.target.closest('[data-action="bot-deep-link"]')) openBot();
});

refreshNode.addEventListener("click", load);
if (tg) tg.onEvent("themeChanged", render);
load();
</script>
</body>
</html>
