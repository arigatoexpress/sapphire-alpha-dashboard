{
  "steps": [
    {
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:96a99902b17be6192e01bd94067d72e9c1c017a042ad970e98eb576070562058",
      "entrypoint": "python3",
      "args": [
        "scripts/deploy_contract.py",
        "verify-workspace",
        "--descriptor-zlib-b64",
        "${_ACTION_DESCRIPTOR_ZLIB_B64}",
        "--descriptor-sha256",
        "${_ACTION_DESCRIPTOR_SHA256}"
      ]
    },
    {
      "name": "gcr.io/cloud-builders/docker@sha256:680b2a8d18a794c165cf97a3f9476784d5d962e945d424cb40b3e086cde0c284",
      "args": [
        "build",
        "-t",
        "gcr.io/sapphire-479610/sapphire-alpha-dashboard:$BUILD_ID",
        "--build-arg",
        "SAPPHIRE_BUILD_SHA=${_BUILD_SHA}",
        "--build-arg",
        "SAPPHIRE_BUILD_ID=$BUILD_ID",
        "-f",
        "Dockerfile",
        "."
      ]
    },
    {
      "name": "gcr.io/cloud-builders/docker@sha256:680b2a8d18a794c165cf97a3f9476784d5d962e945d424cb40b3e086cde0c284",
      "args": [
        "push",
        "gcr.io/sapphire-479610/sapphire-alpha-dashboard:$BUILD_ID"
      ]
    }
  ],
  "images": [
    "gcr.io/sapphire-479610/sapphire-alpha-dashboard:$BUILD_ID"
  ],
  "substitutions": {
    "_ACTION_DESCRIPTOR_ZLIB_B64": "unknown",
    "_ACTION_DESCRIPTOR_SHA256": "unknown",
    "_BUILD_SHA": "unknown",
    "_SOURCE_TREE_SHA": "unknown",
    "_SOURCE_ARCHIVE_SHA256": "unknown",
    "_SOURCE_ARCHIVE_MD5": "unknown",
    "_SOURCE_FILE_COUNT": "unknown",
    "_SOURCE_GENERATION": "unknown",
    "_SOURCE_MANIFEST_SHA256": "unknown",
    "_SOURCE_OBJECT": "unknown"
  },
  "timeout": "1800s",
  "options": {
    "logging": "LEGACY",
    "substitutionOption": "ALLOW_LOOSE",
    "sourceProvenanceHash": [
      "SHA256"
    ]
  }
}
