steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-alpha-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'AUTH_USERNAME=sapphire'
      - '--update-env-vars'
      - 'AUTH_PASSWORD=${_AUTH_PASSWORD}'
      - '--update-env-vars'
      - 'WALLET_ADDRESS=0x6D669f4b197Ee634A8744Fcdc55bA4ceFf057c5E'
      - '--update-env-vars'
      - 'MAX_ORDER_USD=25'
      - '--update-env-vars'
      - 'TELEGRAM_BOT_POLLING=true'
      - '--update-env-vars'
      - 'TV_WEBHOOK_URL=not configured'
      - '--update-env-vars'
      - 'TDR_PRO_LIVE=1'
      - '--update-env-vars'
      - 'DASHBOARD_ARMED=false'
      - '--update-env-vars'
      - 'DASHBOARD_MODE=telegram'
      - '--update-env-vars'
      - 'DASHBOARD_FORCE_KILLSWITCH=false'

images:
  - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'

options:
  logging: LEGACY

substitutions:
  _AUTH_PASSWORD: ''
