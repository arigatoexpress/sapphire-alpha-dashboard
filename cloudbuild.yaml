{
  "steps": [
    {
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:96a99902b17be6192e01bd94067d72e9c1c017a042ad970e98eb576070562058",
      "entrypoint": "python3",
      "args": [
        "scripts/deploy_contract.py",
